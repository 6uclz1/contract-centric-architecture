name: Validate contract and generated views
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test:report
      - run: pnpm validate
      - run: pnpm check
      - run: pnpm traceability --results .artifacts/test-results.json
      - run: pnpm db:check
      - run: pnpm db:up
      - run: pnpm db:live
      - run: pnpm db:test
      - run: pnpm test:db
      - run: pnpm db:down
        if: always()
      - run: pnpm render
      - uses: actions/upload-artifact@v4
        with:
          name: representative-diagrams
          path: .artifacts/render/
