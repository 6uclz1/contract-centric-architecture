name: cca-poc-local
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: cca
      POSTGRES_PASSWORD: cca_local_only
      POSTGRES_DB: cca
    ports:
      - "127.0.0.1:${CCA_DB_PORT:-55432}:5432"
    volumes:
      - cca_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-contract-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cca -d cca"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  cca_pgdata:
