apiVersion: cca.dev/v1alpha1
metadata:
  id: expenses
  name: 経費精算
entities:
  - id: User
    name: 利用者
    fields:
      - id: id
        type: string
        required: true
      - id: name
        type: string
        required: true
      - id: canApprove
        type: boolean
        required: true
  - id: Expense
    name: 経費申請
    fields:
      - id: id
        type: string
        required: true
      - id: amountJpy
        type: integer
        required: true
        description: 申請額。単位は円
      - id: status
        type: state
        machine: ExpenseLifecycle
        required: false
  - id: Payment
    name: 支払記録
    fields:
      - id: id
        type: string
        required: true
      - id: receiptNumber
        type: string
        required: true
      - id: paidAt
        type: datetime
        required: true
relationships:
  - id: ExpenseApplicant
    name: 申請者
    from: Expense
    to: User
    targetsPerSource:
      min: 1
      max: 1
    sourcesPerTarget:
      min: 0
      max: many
  - id: ExpenseApprover
    name: 承認者
    from: Expense
    to: User
    targetsPerSource:
      min: 0
      max: 1
    sourcesPerTarget:
      min: 0
      max: many
  - id: ExpensePayment
    name: 支払記録
    from: Expense
    to: Payment
    targetsPerSource:
      min: 0
      max: 1
    sourcesPerTarget:
      min: 1
      max: 1
stateMachines:
  - id: ExpenseLifecycle
    entity: Expense
    field: status
    states:
      - draft
      - submitted
      - approved
      - rejected
      - paid
    initial: draft
    transitions:
      - id: Submit
        from: draft
        to: submitted
        command: SubmitExpense
      - id: Approve
        from: submitted
        to: approved
        command: ApproveExpense
      - id: Reject
        from: submitted
        to: rejected
        command: RejectExpense
      - id: RecordPaid
        from: approved
        to: paid
        command: RecordPayment
commands:
  - id: SubmitExpense
    name: 申請する
    target: Expense
    preconditions: []
    postconditions: []
    effects: []
  - id: ApproveExpense
    name: 承認する
    target: Expense
    preconditions:
      - EXP-001
      - EXP-002
    postconditions:
      - EXP-003
    effects:
      - id: ApprovalNotice
        kind: notification
        description: 申請者に承認結果を通知する意図。配送の実装・保証は対象外
  - id: RejectExpense
    name: 却下する
    target: Expense
    preconditions:
      - EXP-002
    postconditions: []
    effects: []
  - id: RecordPayment
    name: 完了済み支払を記録する
    target: Expense
    preconditions: []
    postconditions:
      - EXP-005
    effects: []
rules:
  - id: EXP-001
    kind: precondition
    scope:
      kind: entity
      id: Expense
    description: 操作者は対象申請の申請者本人ではない
  - id: EXP-002
    kind: precondition
    scope:
      kind: entity
      id: Expense
    description: 操作者は承認権限を持つ。v0.1では承認と却下に共通して必要
  - id: EXP-003
    kind: postcondition
    scope:
      kind: entity
      id: Expense
    description: 成功後、対象申請の承認者として操作者が記録される
  - id: EXP-004
    kind: invariant
    scope:
      kind: relationship
      id: ExpensePayment
    description: 一申請の支払記録は最大一件。構造上の正本はExpensePaymentの多重度
  - id: EXP-005
    kind: postcondition
    scope:
      kind: entity
      id: Expense
    description: 成功後、対象申請に対応するPaymentが一件存在する
  - id: EXP-006
    kind: invariant
    scope:
      kind: entity
      id: Expense
    description: statusがpaidである申請には、対応するPaymentが一件存在する
constraints:
  - id: PaymentReceiptUnique
    kind: unique
    entity: Payment
    fields:
      - receiptNumber
